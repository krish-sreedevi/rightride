<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Right Ride Admin</title>
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
<style>
:root { --bg:#f5f5f7; --panel:#fff; --text:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.08); --chip:rgba(0,0,0,.05); --brand:#C9281B; --brand-soft:rgba(201,40,27,.1); --grad:linear-gradient(180deg,#DA4330,#B81F14); --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#000; --panel:#1c1c1e; --text:#f5f5f7; --muted:#98989d; --line:rgba(255,255,255,.1); --chip:rgba(255,255,255,.07); --brand:#FF5A3A; --brand-soft:rgba(255,90,58,.16); --grad:linear-gradient(180deg,#FF6A48,#E5341F); --shadow:none; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
.rrw { font-family:Michroma, Inter, sans-serif; color:var(--brand); font-weight:400; }
header { display:flex; align-items:center; gap:14px; padding:14px max(16px, calc((100vw - 1180px)/2)); border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; }
header h1 { font-family:Michroma, Inter, sans-serif; font-weight:400; font-size:1.05rem; margin:0; }
header img { height:30px; }
header .sp { flex:1; }
main { max-width:1180px; margin:0 auto; padding:22px 16px 60px; }
.card { background:var(--panel); border-radius:20px; box-shadow:var(--shadow); padding:20px 22px; }
.btn { border:0; border-radius:999px; padding:9px 18px; font:600 .9rem Inter, sans-serif; cursor:pointer; background:var(--chip); color:var(--text); }
.btn.primary { background:var(--grad); color:#fff; }
.btn:focus-visible, input:focus-visible, .seg button:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
input { font:inherit; padding:11px 14px; border-radius:12px; border:0; background:var(--chip); color:var(--text); width:100%; }
label { display:block; font-size:.82rem; font-weight:600; color:var(--muted); margin:14px 0 6px; }
.login { max-width:460px; margin:40px auto; }
.login h2 { font-family:Michroma, Inter, sans-serif; font-weight:400; font-size:1.3rem; margin:0 0 4px; }
.muted { color:var(--muted); } .small { font-size:.82rem; }
.err { color:var(--brand); font-weight:600; margin-top:12px; }
.bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
.seg { display:inline-flex; background:var(--chip); border-radius:999px; padding:3px; }
.seg button { border:0; background:none; font:600 .85rem Inter, sans-serif; color:var(--text); padding:7px 14px; border-radius:999px; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--panel); box-shadow:0 1px 4px rgba(0,0,0,.12); }
.kpis { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin-bottom:16px; }
.kpi .k { font-size:.8rem; font-weight:600; color:var(--muted); }
.kpi .v { font-size:2rem; font-weight:700; letter-spacing:-.02em; line-height:1.15; margin-top:4px; }
.kpi .s { font-size:.8rem; color:var(--muted); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
h3 { margin:0 0 4px; font-size:1.05rem; }
.chart { position:relative; height:200px; margin-top:12px; }
.chart svg { width:100%; height:100%; display:block; overflow:visible; }
.chart .ax { fill:var(--muted); font-size:11px; }
.chart .grid { stroke:var(--line); }
.chart rect.b { fill:var(--brand); }
.chart rect.hit { fill:transparent; cursor:default; }
.chart rect.hit:hover + rect.b, .chart g:hover rect.b { opacity:.75; }
.tip { position:absolute; pointer-events:none; background:var(--text); color:var(--bg); font-size:.8rem; padding:6px 10px; border-radius:8px; white-space:nowrap; transform:translate(-50%, -110%); opacity:0; transition:opacity .12s; }
.list { list-style:none; margin:12px 0 0; padding:0; display:grid; gap:9px; }
.list li { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; align-items:center; font-size:.88rem; }
.list .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.list .nm small { color:var(--muted); margin-left:6px; }
.list .ct { font-weight:700; font-variant-numeric:tabular-nums; }
.list .tr { grid-column:1 / -1; height:6px; border-radius:3px; background:var(--chip); overflow:hidden; }
.list .tr i { display:block; height:100%; border-radius:3px; background:var(--brand); }
.empty { color:var(--muted); padding:18px 0 4px; }
.tabs { margin-top:10px; }
details { margin-top:16px; } summary { cursor:pointer; font-weight:600; }
table { width:100%; border-collapse:collapse; font-size:.85rem; margin-top:10px; }
th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); } td.n { text-align:right; font-variant-numeric:tabular-nums; }
@media (max-width: 820px) { .kpis { grid-template-columns:1fr 1fr; } .grid2 { grid-template-columns:1fr; } .kpi .v { font-size:1.6rem; } }
</style>
</head>
<body>
<header>
  <picture><source srcset="brand/logo-red-white.svg" media="(prefers-color-scheme: dark)"><img src="brand/logo-red-black.svg" alt="Right Ride"></picture>
  <h1>Admin</h1><span class="sp"></span>
  <button class="btn" id="out" hidden>Sign out</button>
</header>
<main id="app"></main>
<script src="analytics.js" data-admin></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const st = { get(k) { try { return localStorage.getItem('rradmin.' + k) || ''; } catch (e) { return ''; } }, set(k, v) { try { v ? localStorage.setItem('rradmin.' + k, v) : localStorage.removeItem('rradmin.' + k); } catch (e) {} } };
  const S = { code: st.get('code') || (window.RR_ANALYTICS || {}).goatcounter || '', token: st.get('token'), days: +(st.get('days') || 30), tab: 'brand' };
  const brandWord = (s) => esc(s).replace(/\b(Right|Ride)\b/g, '<span class="rrw">$1</span>');

  function login(msg) {
    $('#out').hidden = true;
    $('#app').innerHTML = `<form class="card login" id="lf"><h2>Sign in</h2><p class="muted small">Visits are counted with GoatCounter. Enter your GoatCounter site code and an API token with "Read statistics" permission (GoatCounter → Settings → API).</p>
      <label for="code">Site code</label><input id="code" value="${esc(S.code)}" placeholder="e.g. rightride" autocomplete="username" required>
      <label for="tok">API token</label><input id="tok" type="password" value="" placeholder="Paste token" autocomplete="current-password" required>
      <label style="display:flex;gap:8px;align-items:center;font-weight:500;color:var(--text)"><input type="checkbox" id="rem" style="width:auto" checked> Remember on this device</label>
      <div style="margin-top:16px"><button class="btn primary" type="submit">Open dashboard</button></div>${msg ? `<div class="err">${esc(msg)}</div>` : ''}</form>`;
    $('#lf').onsubmit = (e) => { e.preventDefault(); S.code = $('#code').value.trim().replace(/\.goatcounter\.com.*$/, '').replace(/^https?:\/\//, ''); S.token = $('#tok').value.trim(); if ($('#rem').checked) { st.set('code', S.code); st.set('token', S.token); } else st.set('token', ''); load(); };
  }

  const day = (d) => d.toISOString().slice(0, 10);
  async function api(path, params) {
    const u = new URL(`https://${S.code}.goatcounter.com/api/v0/${path}`);
    for (const [k, v] of Object.entries(params || {})) if (v != null && v !== '') u.searchParams.set(k, v);
    for (let i = 0; i < 4; i++) {
      const r = await fetch(u, { headers: { Authorization: 'Bearer ' + S.token, 'Content-Type': 'application/json' } });
      if (r.status === 429) { await new Promise((ok) => setTimeout(ok, 1100 * (i + 1))); continue; }
      if (r.status === 401 || r.status === 403) throw new Error('auth');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }
    throw new Error('Too many requests, try again in a minute');
  }
  async function allHits(range) {
    const out = []; let exclude = [];
    for (let page = 0; page < 20; page++) {
      const j = await api('stats/hits', { ...range, limit: 100, exclude_paths: exclude.join(',') });
      out.push(...(j.hits || []));
      if (!j.more || !(j.hits || []).length) break;
      exclude = out.map((h) => h.path_id);
    }
    return out;
  }

  let D = null;
  async function load() {
    $('#app').innerHTML = '<p class="muted">Loading…</p>';
    if (!S.code || !S.token) return login();
    const end = new Date(), start = new Date(Date.now() - (S.days - 1) * 864e5);
    const range = { start: day(start), end: day(end) };
    try {
      const [tot, hits] = await Promise.all([api('stats/total', range), allHits(range)]);
      D = { tot, hits, range };
      draw();
    } catch (e) {
      if (e.message === 'auth') { st.set('token', ''); S.token = ''; return login('That token was not accepted. Check the site code and that the token can read statistics.'); }
      $('#app').innerHTML = `<div class="card"><b>Couldn't load the numbers.</b><p class="muted">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div>`;
    }
  }

  const dec = (s) => { try { return decodeURIComponent(String(s).replace(/\+/g, ' ')); } catch (e) { return s; } };
  function agg(list, keyFn) { const m = new Map(); for (const h of list) { const k = keyFn(h); if (!k) continue; m.set(k, (m.get(k) || 0) + h.count); } return [...m].sort((a, b) => b[1] - a[1]); }
  function barList(rows, unit, n = 12) {
    if (!rows.length) return `<p class="empty">Nothing yet for this period.</p>`;
    const max = rows[0][1];
    return `<ol class="list">${rows.slice(0, n).map(([k, v]) => { const [a, b] = Array.isArray(k) ? k : [k, '']; return `<li><span class="nm" title="${esc(a + (b ? ' · ' + b : ''))}">${esc(a)}${b ? `<small>${esc(b)}</small>` : ''}</span><span class="ct">${v.toLocaleString('en-IN')}</span><span class="tr" aria-hidden="true"><i style="width:${Math.max(2, v / max * 100)}%"></i></span></li>`; }).join('')}</ol>${rows.length > n ? `<p class="muted small">+ ${rows.length - n} more</p>` : ''}`;
  }
  function dailyChart(stats) {
    const days = (stats || []).map((s) => ({ d: s.day, v: s.daily || 0 }));
    if (!days.length) return '<p class="empty">No visits yet.</p>';
    const W = 1000, H = 200, pad = { l: 34, r: 6, t: 8, b: 22 };
    const max = Math.max(1, ...days.map((x) => x.v)), nice = Math.ceil(max / Math.pow(10, Math.floor(Math.log10(max)))) * Math.pow(10, Math.floor(Math.log10(max)));
    const bw = (W - pad.l - pad.r) / days.length, gap = Math.min(2, bw * .2);
    const y = (v) => pad.t + (H - pad.t - pad.b) * (1 - v / nice);
    const ticks = [0, nice / 2, nice];
    const lab = (i) => new Date(days[i].d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    const every = Math.ceil(days.length / 8);
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Visitors per day">
      ${ticks.map((t) => `<line class="grid" x1="${pad.l}" x2="${W - pad.r}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${pad.l - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('')}
      ${days.map((x, i) => { const bx = pad.l + i * bw + gap / 2, h = Math.max(x.v ? 2 : 0, H - pad.b - y(x.v)); return `<g data-i="${i}"><rect class="hit" x="${pad.l + i * bw}" y="${pad.t}" width="${bw}" height="${H - pad.t - pad.b}"/><rect class="b" x="${bx}" y="${H - pad.b - h}" width="${bw - gap}" height="${h}" rx="${Math.min(4, (bw - gap) / 2)}"/></g>`; }).join('')}
      ${days.map((x, i) => (i % every === 0 ? `<text class="ax" x="${pad.l + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${lab(i)}</text>` : '')).join('')}
    </svg><div class="tip" id="tip"></div>`;
  }

  function draw() {
    $('#out').hidden = false;
    const { tot, hits, range } = D;
    const pages = hits.filter((h) => !h.event), ev = hits.filter((h) => h.event);
    const td = ev.filter((h) => /^testdrive\//.test(h.path)).map((h) => { const [, b, m, d] = h.path.split('/'); return { b: dec(b), m: dec(m), d: dec(d || ''), count: h.count }; });
    const calls = ev.filter((h) => /^call\//.test(h.path)).reduce((s, h) => s + h.count, 0);
    const sites = ev.filter((h) => /^dealer-site\//.test(h.path)).reduce((s, h) => s + h.count, 0);
    const carPages = pages.filter((h) => /^\/car\//.test(h.path));
    const visitors = (tot.total || 0) - (tot.total_events || 0);
    const tdTotal = td.reduce((s, h) => s + h.count, 0), cpTotal = carPages.reduce((s, h) => s + h.count, 0);
    const tabRows = { brand: agg(td, (h) => h.b), car: agg(td, (h) => h.b + ' ' + h.m), dealer: agg(td, (h) => h.d ? h.d + '|' + h.b : '') .map(([k, v]) => { const [d, b] = k.split('|'); return [[d, b], v]; }) };
    $('#app').innerHTML = `
      <div class="bar"><div class="seg" role="group" aria-label="Period">${[7, 30, 90, 365].map((d) => `<button data-days="${d}" aria-pressed="${S.days === d}">${d === 365 ? '1 year' : d + ' days'}</button>`).join('')}</div>
        <span class="muted small">${esc(range.start)} to ${esc(range.end)} · ${esc(S.code)}.goatcounter.com</span></div>
      <div class="kpis">
        <div class="card kpi"><div class="k">Visitors</div><div class="v">${visitors.toLocaleString('en-IN')}</div><div class="s">unique visits to the site</div></div>
        <div class="card kpi"><div class="k">Car page views</div><div class="v">${cpTotal.toLocaleString('en-IN')}</div><div class="s">across ${carPages.length} car${carPages.length === 1 ? '' : 's'}</div></div>
        <div class="card kpi"><div class="k">Test-drive clicks</div><div class="v">${tdTotal.toLocaleString('en-IN')}</div><div class="s">${visitors ? ((tdTotal / visitors) * 100).toFixed(1) + '% of visitors' : '–'}</div></div>
        <div class="card kpi"><div class="k">Dealer calls · websites</div><div class="v">${calls.toLocaleString('en-IN')} · ${sites.toLocaleString('en-IN')}</div><div class="s">taps on phone numbers and dealer sites</div></div>
      </div>
      <div class="card"><h3>Visitors per day</h3><div class="chart" id="ch">${dailyChart(tot.stats)}</div></div>
      <div class="grid2">
        <div class="card"><h3>Most visited car pages</h3>${barList(carPages.map((h) => [[h.title || h.path, ''], h.count]))}</div>
        <div class="card"><h3>Test-drive clicks</h3>
          <div class="seg tabs" role="group" aria-label="Group by">${[['brand', 'Per brand'], ['car', 'Per car'], ['dealer', 'Per dealer']].map(([k, l]) => `<button data-tab="${k}" aria-pressed="${S.tab === k}">${l}</button>`).join('')}</div>
          ${barList(tabRows[S.tab])}</div>
      </div>
      <div class="grid2">
        <div class="card"><h3>All pages</h3>${barList(pages.map((h) => [[h.title || h.path, h.path], h.count]), '', 10)}</div>
        <div class="card"><h3>Every test-drive click</h3>${td.length ? `<table><thead><tr><th>Car</th><th>Dealer</th><th style="text-align:right">Clicks</th></tr></thead><tbody>${td.sort((a, b) => b.count - a.count).slice(0, 60).map((h) => `<tr><td>${esc(h.b + ' ' + h.m)}</td><td>${esc(h.d || '–')}</td><td class="n">${h.count}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">No test-drive clicks yet.</p>'}</div>
      </div>
      <p class="muted small" style="margin-top:18px">Counts are GoatCounter "visitors": each person is counted once per page per day, with no cookies. <a href="https://${esc(S.code)}.goatcounter.com" target="_blank" rel="noopener" style="color:var(--brand)">Open GoatCounter ↗</a></p>`;
    wire();
  }
  function wire() {
    for (const b of document.querySelectorAll('[data-days]')) b.onclick = () => { S.days = +b.dataset.days; st.set('days', S.days); load(); };
    for (const b of document.querySelectorAll('[data-tab]')) b.onclick = () => { S.tab = b.dataset.tab; draw(); };
    const ch = $('#ch'), tip = $('#tip'); if (!ch || !tip) return;
    const days = D.tot.stats || [];
    ch.onmousemove = (e) => { const g = e.target.closest('g[data-i]'); if (!g) { tip.style.opacity = 0; return; } const x = days[+g.dataset.i]; const r = ch.getBoundingClientRect(); tip.textContent = `${new Date(x.day).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' })}: ${(x.daily || 0).toLocaleString('en-IN')} visitors`; tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px'; tip.style.opacity = 1; };
    ch.onmouseleave = () => { tip.style.opacity = 0; };
  }
  $('#out').onclick = () => { st.set('token', ''); S.token = ''; login(); };
  load();
})();
</script>
</body>
</html>
