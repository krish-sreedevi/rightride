<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Right Ride Admin</title>
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg?v=7t">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
<style>
:root { --bg:#f5f5f7; --panel:#fff; --text:#15181D; --muted:#6e6e73; --line:rgba(0,0,0,.08); --chip:rgba(0,0,0,.05); --brand:#D02A1C; --gold:#C99228; --brand-soft:rgba(208,42,28,.1); --grad:linear-gradient(180deg,#E5341F,#D02A1C); --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#030303; --panel:#15161a; --text:#f5f5f7; --muted:#98989d; --line:rgba(255,255,255,.1); --chip:rgba(255,255,255,.07); --brand:#E5341F; --gold:#F6CF6E; --brand-soft:rgba(229,52,31,.16); --grad:linear-gradient(180deg,#FF5A3A,#E5341F); --shadow:none; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
.rrw { font-family:Michroma, Inter, sans-serif; color:var(--brand); font-weight:400; }
header { display:flex; align-items:center; gap:14px; padding:14px max(16px, calc((100vw - 1180px)/2)); border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; }
header h1 { font-family:Michroma, Inter, sans-serif; font-weight:400; font-size:1.05rem; margin:0; }
header img { height:30px; display:block; }
header .sp { flex:1; }
main { max-width:1180px; margin:0 auto; padding:22px 16px 60px; }
.card { background:var(--panel); border-radius:20px; box-shadow:var(--shadow); padding:20px 22px; min-width:0; }
.btn { border:0; border-radius:999px; padding:9px 18px; font:600 .9rem Inter, sans-serif; cursor:pointer; background:var(--chip); color:var(--text); text-decoration:none; display:inline-block; }
.btn.primary { background:var(--grad); color:#fff; }
.btn:focus-visible, input:focus-visible, .seg button:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
input { font:inherit; padding:11px 14px; border-radius:12px; border:0; background:var(--chip); color:var(--text); width:100%; }
label { display:block; font-size:.82rem; font-weight:600; color:var(--muted); margin:14px 0 6px; }
.login { max-width:420px; margin:40px auto; }
.login h2 { font-family:Michroma, Inter, sans-serif; font-weight:400; font-size:1.3rem; margin:0 0 4px; }
.muted { color:var(--muted); } .small { font-size:.82rem; }
.err { color:var(--brand); font-weight:600; margin-top:12px; }
.bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
.seg { display:inline-flex; background:var(--chip); border-radius:999px; padding:3px; flex-wrap:wrap; }
.seg button { border:0; background:none; font:600 .85rem Inter, sans-serif; color:var(--text); padding:7px 14px; border-radius:999px; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--panel); box-shadow:0 1px 4px rgba(0,0,0,.12); }
.kpis { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin-bottom:16px; }
.kpis.six { grid-template-columns:repeat(6, 1fr); }
.kpi .k { font-size:.8rem; font-weight:600; color:var(--muted); }
.kpi .v { font-size:1.9rem; font-weight:700; letter-spacing:-.02em; line-height:1.15; margin-top:4px; }
.kpi .s { font-size:.8rem; color:var(--muted); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
.grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-top:16px; }
h2.sec { font-family:Michroma, Inter, sans-serif; font-weight:400; font-size:1.05rem; margin:34px 0 4px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
h2.sec .src { font:600 .75rem Inter, sans-serif; color:var(--muted); background:var(--chip); border-radius:999px; padding:3px 10px; }
h2.sec + p { margin:0 0 14px; }
h3 { margin:0 0 4px; font-size:1.05rem; }
.chart { position:relative; height:200px; margin-top:12px; }
.chart svg { width:100%; height:100%; display:block; overflow:visible; }
.chart .ax { fill:var(--muted); font-size:11px; }
.chart .grid { stroke:var(--line); }
.chart rect.b { fill:var(--brand); }
.chart path.ln { fill:none; stroke:var(--gold); stroke-width:2.5; vector-effect:non-scaling-stroke; }
.chart rect.hit { fill:transparent; }
.chart g:hover rect.b { opacity:.75; }
.legend { display:flex; gap:16px; font-size:.8rem; color:var(--muted); margin-top:6px; flex-wrap:wrap; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
.tip { position:absolute; pointer-events:none; background:var(--text); color:var(--bg); font-size:.8rem; padding:6px 10px; border-radius:8px; white-space:nowrap; transform:translate(-50%, -110%); opacity:0; transition:opacity .12s; }
.list { list-style:none; margin:12px 0 0; padding:0; display:grid; gap:9px; }
.list li { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; align-items:center; font-size:.88rem; }
.list .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.list .nm small { color:var(--muted); margin-left:6px; }
.list .ct { font-weight:700; font-variant-numeric:tabular-nums; }
.list .tr { grid-column:1 / -1; height:6px; border-radius:3px; background:var(--chip); overflow:hidden; }
.list .tr i { display:block; height:100%; border-radius:3px; background:var(--brand); }
.list.gold .tr i { background:var(--gold); }
.empty { color:var(--muted); padding:18px 0 4px; }
.tabs { margin-top:10px; }
table { width:100%; border-collapse:collapse; font-size:.85rem; margin-top:10px; }
th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); } td.n { text-align:right; font-variant-numeric:tabular-nums; }
.setup { border:1px dashed var(--line); box-shadow:none; }
.setup ol { margin:8px 0 0; padding-left:20px; } .setup li { margin:4px 0; }
.setup code { background:var(--chip); padding:1px 6px; border-radius:6px; font-size:.82rem; }
.links { display:flex; gap:8px; flex-wrap:wrap; }
@media (max-width: 980px) { .kpis.six { grid-template-columns:repeat(3, 1fr); } .grid3 { grid-template-columns:1fr 1fr; } }
@media (max-width: 820px) { .kpis, .kpis.six { grid-template-columns:1fr 1fr; } .grid2, .grid3 { grid-template-columns:1fr; } .kpi .v { font-size:1.5rem; } }
.nav { display:flex; gap:4px; overflow-x:auto; padding:0 max(16px, calc((100vw - 1180px)/2)); background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:59px; z-index:4; scrollbar-width:none; }
.nav button { border:0; background:none; font:600 .92rem Inter, sans-serif; color:var(--muted); padding:13px 14px 11px; border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; }
.nav button[aria-selected="true"] { color:var(--text); border-bottom-color:var(--brand); }
.nav button:focus-visible { outline:2px solid var(--brand); outline-offset:-2px; }
.funnel { display:grid; gap:10px; margin-top:12px; }
.funnel .st { display:grid; grid-template-columns:140px minmax(0,1fr) 130px; gap:12px; align-items:center; font-size:.88rem; }
.funnel .bx { height:26px; border-radius:8px; background:var(--chip); overflow:hidden; } .funnel .bx i { display:block; height:100%; background:var(--grad); border-radius:8px; }
.funnel .pc { text-align:right; font-weight:700; font-variant-numeric:tabular-nums; } .funnel .pc small { display:block; font-weight:500; color:var(--muted); font-size:.75rem; }
.money td input { width:90px; padding:6px 10px; text-align:right; border-radius:8px; }
.money td, .money th { vertical-align:middle; } .money tfoot td { font-weight:700; border-bottom:0; font-size:.95rem; }
.money .why { color:var(--muted); font-size:.8rem; }
.big { font-size:2.3rem; font-weight:700; letter-spacing:-.02em; }
.ideas { margin:10px 0 0; padding-left:18px; } .ideas li { margin:7px 0; font-size:.9rem; }
.note { font-size:.82rem; color:var(--muted); margin-top:10px; }
@media (max-width: 820px) { .funnel .st { grid-template-columns:96px minmax(0,1fr) 96px; } .nav { top:57px; } .money .why { display:none; } }
.dates { display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap; }
.dates input { width:auto; padding:7px 10px; border-radius:999px; font:600 .85rem Inter, sans-serif; color-scheme:light dark; }
@media (max-width: 480px) { .bar > .seg { flex-wrap:nowrap; } .bar > .seg button { padding:7px 9px; font-size:.8rem; } }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); margin:0; }
</style>
</head>
<body>
<header>
  <picture><source srcset="brand/logo-night.svg" media="(prefers-color-scheme: dark)"><img src="brand/logo-day.svg" alt="Right Ride" width="93" height="30"></picture>
  <h1>Admin</h1><span class="sp"></span>
  <button class="btn" id="out" hidden>Sign out</button>
</header>
<nav class="nav" id="nav" role="tablist" aria-label="Sections" hidden></nav>
<main id="app"></main>
<script>
(() => {
  // Stats are fetched every hour by the site's GitHub workflow (tools/admin-stats.mjs) and published encrypted.
  // Signing in derives the key from the username + password and decrypts them here, in the browser.
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = (s) => ({ get(k) { try { return s.getItem('rradmin.' + k) || ''; } catch (e) { return ''; } }, set(k, v) { try { v ? s.setItem('rradmin.' + k, v) : s.removeItem('rradmin.' + k); } catch (e) {} } });
  const LS = store(window.localStorage), SS = store(window.sessionStorage);
  const TABS = [['overview', 'Overview'], ['bookings', 'Bookings'], ['videos', 'Videos'], ['audience', 'Audience'], ['money', 'Money']];
  const S = { days: LS.get('days') === 'custom' ? 'custom' : +(LS.get('days') || 30), from: LS.get('from'), to: LS.get('to'), tab: (location.hash.slice(1) || LS.get('tab') || 'overview'), by: { td: 'brand', vid: 'car' } };
  if (!TABS.some(([k]) => k === S.tab)) S.tab = 'overview';
  // what each tracked click is worth (your assumptions, editable on the Money tab, kept on this device)
  const RATE_DEF = { testdrive: 250, call: 150, 'dealer-site': 15, 'maker-site': 10, video: 3, rpm: 60 };
  let RATE = { ...RATE_DEF }; try { Object.assign(RATE, JSON.parse(LS.get('rates') || '{}')); } catch (e) {}
  const fmt = (n) => (Math.round(n || 0)).toLocaleString('en-IN');
  const rs = (n) => '₹' + (n >= 1e5 ? (n / 1e5).toFixed(n >= 1e6 ? 1 : 2) + ' L' : fmt(n));
  const pct = (a, b) => (b ? ((a / b) * 100).toFixed(a / b < 0.1 ? 1 : 0) + '%' : '–');
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));

  let FILE = null, DATA = null;
  const getFile = () => FILE ? Promise.resolve(FILE) : fetch('data/admin-stats.enc.json?t=' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null).then((j) => (FILE = j));
  async function keyFrom(user, pass, f) {
    const pw = await crypto.subtle.importKey('raw', new TextEncoder().encode(`${user.trim().toLowerCase()}\n${pass}`), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode(f.salt), iterations: f.iter }, pw, 256);
  }
  async function decrypt(raw, f) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(f.iv) }, key, b64(f.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  function login(msg) {
    $('#out').hidden = true; $('#nav').hidden = true;
    $('#app').innerHTML = `<form class="card login" id="lf"><h2>Sign in</h2><p class="muted small">Usage from GoatCounter and Google Analytics, in one place.</p>
      <label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
      <label style="display:flex;gap:8px;align-items:center;font-weight:500;color:var(--text)"><input type="checkbox" id="rem" style="width:auto" checked> Keep me signed in on this device</label>
      <div style="margin-top:16px"><button class="btn primary" type="submit" id="go">Sign in</button></div>${msg ? `<div class="err" role="alert">${esc(msg)}</div>` : ''}</form>`;
    $('#u').focus();
    $('#lf').onsubmit = async (e) => {
      e.preventDefault(); $('#go').disabled = true; $('#go').textContent = 'Signing in…';
      const f = await getFile();
      if (!f) return login('The usage numbers haven\'t been published yet. They refresh every hour; try again later.');
      try {
        const raw = await keyFrom($('#u').value, $('#p').value, f);
        DATA = await decrypt(raw, f);
        (($('#rem').checked) ? LS : SS).set('key', toB64(raw));
        draw();
      } catch (err) { login('That username and password don\'t match.'); }
    };
  }
  async function start() {
    const k = LS.get('key') || SS.get('key');
    if (!k) return login();
    $('#app').innerHTML = '<p class="muted">Loading…</p>';
    const f = await getFile();
    if (!f) return login('The usage numbers haven\'t been published yet. They refresh every hour; try again later.');
    try { DATA = await decrypt(b64(k), f); draw(); } catch (e) { LS.set('key', ''); SS.set('key', ''); login(); }
  }

  // ---------- turning the raw numbers into what each tab needs ----------
  const dec = (s) => { try { return decodeURIComponent(String(s || '').replace(/\+/g, ' ')); } catch (e) { return s; } };
  const sum = (l) => l.reduce((s, h) => s + h.count, 0);
  function agg(list, keyFn) { const m = new Map(); for (const h of list) { const k = keyFn(h); if (!k) continue; m.set(k, (m.get(k) || 0) + h.count); } return [...m].sort((a, b) => b[1] - a[1]); }
  // ---------- date range: a preset (last N days) or a custom from/to ----------
  const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const spanDays = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5) + 1;
  const niceDay = (iso) => new Date(iso + 'T00:00:00Z').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
  function allDays() {
    const Y = DATA.gc && DATA.gc.periods && DATA.gc.periods['365'];
    const l = Y ? Y.tot.stats.map((x) => x.day) : DATA.ga && DATA.ga.daily ? DATA.ga.daily.totals.map((r) => r[0]).sort() : [];
    return l.length ? l : [new Date().toISOString().slice(0, 10)];
  }
  function range() {
    const days = allDays(), first = days[0], last = days[days.length - 1];
    if (S.days !== 'custom') return { from: addDays(last, -(S.days - 1)), to: last, custom: false, first, last };
    let from = S.from && S.from >= first ? S.from : addDays(last, -29), to = S.to && S.to <= last ? S.to : last;
    if (from > to) [from, to] = [to, from];
    return { from, to, custom: true, first, last };
  }
  // GA numbers for a custom range, added up from the per-day table (users are added per day, so they're approximate)
  function gaRange(G, R) {
    const inR = (d) => d >= R.from && d <= R.to;
    const rows = G.totals.filter((r) => inR(r[0]));
    const t = rows.reduce((s, r) => s.map((x, i) => x + (r[i + 1] || 0)), [0, 0, 0, 0, 0, 0]);
    const top = (list, n = 15) => { const m = new Map(); for (const [d, k, v] of list) if (inR(d)) m.set(k, (m.get(k) || 0) + v); return [...m].sort((a, b) => b[1] - a[1]).slice(0, n); };
    return { approx: true, totals: { users: t[0], newUsers: t[1], sessions: t[2], views: t[3], avgSec: t[2] ? t[4] / t[2] : 0, engagement: t[2] ? t[5] / t[2] : 0 }, daily: rows.map((r) => ({ day: r[0], v: r[1] })).sort((a, b) => (a.day < b.day ? -1 : 1)), pages: top(G.pages), channels: top(G.channels, 8), sources: top(G.sources), cities: top(G.cities), devices: top(G.devices, 5), events: top(G.events, 20) };
  }
  function model() {
    const D = DATA, R = range();
    R.n = spanDays(R.from, R.to);
    // lists GoatCounter only gives per period (referrers, countries, screens) use the smallest period that covers the range
    const P = R.custom ? String([7, 30, 90, 365].find((n) => n >= spanDays(R.from, R.last)) || 365) : String(S.days);
    const g = (D.gc && D.gc.periods && D.gc.periods[P]) || null;
    const Y = D.gc && D.gc.periods && D.gc.periods['365'];
    let a = (D.ga && D.ga.periods && D.ga.periods[P]) || null;
    if (R.custom) a = D.ga && D.ga.daily ? gaRange(D.ga.daily, R) : null;
    let hits = [], tot = { total: 0, total_events: 0, stats: [] }, dayList = [];
    if (Y && Y.hits.some((h) => h.s)) {
      // add up each page and click over the chosen days, from the 1-year per-day counts
      const idx = []; Y.tot.stats.forEach((x, i) => { if (x.day >= R.from && x.day <= R.to) idx.push(i); });
      dayList = idx.map((i) => Y.tot.stats[i].day);
      hits = Y.hits.map((h) => { const m = new Map(h.s || []); const days = idx.map((i) => m.get(i) || 0); return { ...h, days, count: days.reduce((x, y) => x + y, 0) }; }).filter((h) => h.count);
      const stats = idx.map((i) => Y.tot.stats[i]);
      tot = { stats, total: stats.reduce((x, y) => x + (y.daily || 0), 0), total_events: hits.filter((h) => h.event).reduce((x, h) => x + h.count, 0) };
    } else if (g) { hits = g.hits; tot = g.tot; dayList = (tot.stats || []).map((x) => x.day); }
    const pages = hits.filter((h) => !h.event);
    // events are "kind/brand/model/detail"; detail is the dealer, the YouTube channel or the maker
    const ev = hits.filter((h) => h.event).map((h) => { const [kind, b, m, d] = h.path.split('/').map(dec); return { kind, b, m, car: `${b} ${m}`, d: d || '', count: h.count, days: h.days || [] }; });
    const K = (...k) => ev.filter((e) => k.includes(e.kind));
    const perDay = (list) => dayList.map((d, i) => ({ d, v: list.reduce((s, e) => s + (e.days[i] || 0), 0) }));
    const carPages = pages.filter((h) => /^\/car\//.test(h.path));
    const viewsByCar = new Map(carPages.map((h) => [h.title || h.path, h.count]));
    const book = K('testdrive', 'call', 'dealer-site'), vids = K('video');
    const pageViews = a ? a.totals.views : sum(pages);
    const M = { R, P, g, a, tot, pages, ev, K, dayList, perDay, carPages, viewsByCar, book, vids, pageViews,
      gcOn: !!(D.gc && D.gc.connected && !D.gc.error && (g || Y)), gaOn: !!(D.ga && D.ga.connected && !D.ga.error && a),
      visitors: (tot.total || 0) - (tot.total_events || 0), carViews: sum(carPages),
      td: sum(K('testdrive')), calls: sum(K('call')), sites: sum(K('dealer-site')), maker: sum(K('maker-site')), video: sum(vids), reviews: sum(K('review')) };
    M.streams = [
      { k: 'testdrive', name: 'Test-drive leads', what: 'Book-a-test-drive clicks', n: M.td, rate: RATE.testdrive, why: 'Sell leads to dealers or carmakers (cost per lead)' },
      { k: 'call', name: 'Dealer calls', what: 'Taps on a dealer\'s phone number', n: M.calls, rate: RATE.call, why: 'Call leads, charged per call by dealers' },
      { k: 'dealer-site', name: 'Dealer website visits', what: 'Clicks to a dealer\'s website', n: M.sites, rate: RATE['dealer-site'], why: 'Referral traffic for dealers (cost per click)' },
      { k: 'maker-site', name: 'Carmaker website visits', what: 'Clicks to the official car page', n: M.maker, rate: RATE['maker-site'], why: 'Referral or affiliate deals with carmakers' },
      { k: 'video', name: 'YouTube views sent', what: 'Video review clicks', n: M.video, rate: RATE.video, why: 'Sponsored placement for YouTube channels' },
      { k: 'rpm', name: 'Display ads', what: `Page views ÷ 1,000${M.gaOn ? '' : ' (GoatCounter estimate)'}`, n: M.pageViews / 1000, rate: RATE.rpm, why: 'Ad revenue per 1,000 page views (RPM)' },
    ];
    M.streams.forEach((s) => { s.earn = s.n * s.rate; });
    M.earn = M.streams.reduce((s, x) => s + x.earn, 0);
    return M;
  }

  // ---------- drawing helpers ----------
  function barList(rows, n = 12, cls = '') {
    if (!rows || !rows.length) return `<p class="empty">Nothing yet for this period.</p>`;
    const max = rows[0][1] || 1;
    return `<ol class="list ${cls}">${rows.slice(0, n).map(([k, v]) => { const [a, b] = Array.isArray(k) ? k : [k, '']; return `<li><span class="nm" title="${esc(a + (b ? ' · ' + b : ''))}">${esc(a)}${b ? `<small>${esc(b)}</small>` : ''}</span><span class="ct">${typeof v === 'string' ? esc(v) : fmt(v)}</span><span class="tr" aria-hidden="true"><i style="width:${Math.max(2, (parseFloat(v) || 0) / (parseFloat(max) || 1) * 100)}%"></i></span></li>`; }).join('')}</ol>${rows.length > n ? `<p class="muted small">+ ${rows.length - n} more</p>` : ''}`;
  }
  const CH = {};
  // bars = days[i].v, optional gold line = days[i].g
  function chart(id, days, label, lineLabel) {
    CH[id] = { days, label, lineLabel };
    if (!days.length) return `<div class="chart"><p class="empty">No data for this period.</p></div>`;
    const line = !!lineLabel;
    const W = Math.round(Math.max(300, Math.min(1130, innerWidth - 76))), H = 200, pad = { l: 34, r: 6, t: 8, b: 22 };
    const max = Math.max(4, ...days.map((x) => Math.max(x.v || 0, line ? x.g || 0 : 0))), mag = Math.pow(10, Math.floor(Math.log10(max))), nice = Math.max(4, Math.ceil(max / mag) * mag + (Math.ceil(max / mag) * mag) % 2);
    const bw = (W - pad.l - pad.r) / days.length, gap = Math.min(2, bw * .2);
    const y = (v) => pad.t + (H - pad.t - pad.b) * (1 - v / nice);
    const lab = (i) => new Date(days[i].d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    const every = Math.ceil(days.length / (innerWidth < 600 ? 4 : 8));
    const ln = line ? `<path class="ln" d="${days.map((x, i) => `${i ? 'L' : 'M'}${(pad.l + i * bw + bw / 2).toFixed(1)},${y(x.g || 0).toFixed(1)}`).join('')}"/>` : '';
    return `<div class="chart" data-ch="${id}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)} per day">
      ${[0, nice / 2, nice].map((t) => `<line class="grid" x1="${pad.l}" x2="${W - pad.r}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${pad.l - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('')}
      ${days.map((x, i) => { const bx = pad.l + i * bw + gap / 2, h = Math.max(x.v ? 2 : 0, H - pad.b - y(x.v || 0)); return `<g data-i="${i}"><rect class="hit" x="${pad.l + i * bw}" y="${pad.t}" width="${bw}" height="${H - pad.t - pad.b}"/><rect class="b" x="${bx}" y="${H - pad.b - h}" width="${Math.max(0, bw - gap)}" height="${h}" rx="${Math.min(4, (bw - gap) / 2)}"/></g>`; }).join('')}
      ${ln}
      ${days.map((x, i) => (i % every === 0 ? `<text class="ax" x="${pad.l + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${lab(i)}</text>` : '')).join('')}
    </svg><div class="tip"></div></div>`;
  }
  const kpi = (k, v, s) => `<div class="card kpi"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
  const sec = (title, src, sub) => `<h2 class="sec">${title}${src ? ` <span class="src">${esc(src)}</span>` : ''}</h2>${sub ? `<p class="muted small">${sub}</p>` : ''}`;
  const seg = (name, cur, opts) => `<div class="seg tabs" role="group">${opts.map(([k, l]) => `<button data-by="${name}" data-v="${k}" aria-pressed="${cur === k}">${l}</button>`).join('')}</div>`;
  const ago = (iso) => { const m = Math.round((Date.now() - new Date(iso)) / 6e4); return m < 2 ? 'just now' : m < 90 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; };
  const dur = (s) => { s = Math.round(s || 0); return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + (s % 60) + 's'; };

  const SETUP_GC = `<div class="card setup"><h3>Connect GoatCounter</h3><p class="muted small">Add the <code>GC_TOKEN</code> secret in GitHub (repo → Settings → Secrets and variables → Actions) with a GoatCounter API token that can read statistics.</p></div>`;
  const SETUP_GA = `<div class="card setup"><h3>Connect Google Analytics</h3><p class="muted small">Add <code>GA_SA_KEY</code> (service-account JSON) and <code>GA_PROPERTY_ID</code> (numeric) as GitHub secrets, and give the service account Viewer access on the property.</p></div>`;
  const errCard = (src, msg, fix) => `<div class="card"><b>${src} didn't answer.</b><p class="muted small">${esc(msg)}. ${fix}</p></div>`;
  const gcGate = (M, html) => (M.gcOn ? html() : DATA.gc.error ? errCard('GoatCounter', DATA.gc.error, 'If the token was deleted, create a new one and update the <code>GC_TOKEN</code> secret.') : SETUP_GC);
  const gaGate = (M, html) => (M.gaOn ? html() : DATA.ga && DATA.ga.error ? errCard('Google Analytics', DATA.ga.error, 'Check that the service account is a Viewer on the property and that <code>GA_PROPERTY_ID</code> is the numeric property ID.') : SETUP_GA);

  // ---------- tabs ----------
  const V = {};
  V.overview = (M) => {
    const days = M.dayList.map((d, i) => ({ d, v: (M.tot.stats[i] || {}).daily || 0, g: 0 }));
    if (M.a) { const gm = new Map(M.a.daily.map((x) => [x.day, x.v])); if (!days.length) M.a.daily.forEach((x) => days.push({ d: x.day, v: 0, g: x.v })); else days.forEach((x) => { x.g = gm.get(x.d) || 0; }); }
    const bookN = M.td + M.calls + M.sites;
    const stage = (name, n, base, note) => `<div class="st"><span>${name}</span><span class="bx"><i style="width:${Math.max(1, base ? n / base * 100 : 0)}%"></i></span><span class="pc">${fmt(n)}<small>${note}</small></span></div>`;
    return `<div class="kpis">
        ${kpi('Visitors', M.gcOn ? fmt(M.visitors) : M.a ? fmt(M.a.totals.users) : '–', M.gcOn && M.a ? `${fmt(M.a.totals.users)} users in Google Analytics` : 'unique visitors')}
        ${kpi('Bookings', fmt(bookN), `${fmt(M.td)} test drives · ${fmt(M.calls)} calls · ${fmt(M.sites)} dealer sites`)}
        ${kpi('Video clicks', fmt(M.video), `${pct(M.video, M.carViews)} of car-page views`)}
        ${kpi('Estimated earnings', rs(M.earn), `<a href="#money" data-go="money" style="color:var(--brand)">at your rates →</a>`)}
      </div>
      <div class="card"><h3>Visitors per day</h3>${chart('visits', days, 'Visitors', M.a ? 'Google Analytics users' : '')}
        <div class="legend">${M.gcOn ? '<span><i style="background:var(--brand)"></i>GoatCounter visitors</span>' : ''}${M.a ? '<span><i style="background:var(--gold)"></i>Google Analytics users</span>' : ''}</div></div>
      <div class="grid2">
        <div class="card"><h3>From visit to booking</h3><p class="muted small">How many people move on at each step.</p><div class="funnel">
          ${stage('Visitors', M.visitors, M.visitors, '')}
          ${stage('Car page views', M.carViews, M.visitors, pct(M.carViews, M.visitors) + ' of visitors')}
          ${stage('Watched a video', M.video, M.visitors, pct(M.video, M.carViews) + ' of car views')}
          ${stage('Booking action', bookN, M.visitors, pct(bookN, M.carViews) + ' of car views')}</div></div>
        <div class="card"><h3>Most visited cars</h3>${barList(M.carPages.map((h) => [h.title || h.path, h.count]), 8)}</div>
      </div>
      <div class="grid2">
        <div class="card"><h3>Most booked cars</h3>${barList(agg(M.book, (e) => e.car), 8)}</div>
        <div class="card"><h3>Most watched cars</h3>${barList(agg(M.vids, (e) => e.car), 8, 'gold')}</div>
      </div>`;
  };
  V.bookings = (M) => gcGate(M, () => {
    const td = M.K('testdrive');
    const rows = { brand: agg(td, (e) => e.b), car: agg(td, (e) => e.car), dealer: agg(td, (e) => (e.d ? e.d + '|' + e.car : '')).map(([k, v]) => { const [d, c] = k.split('|'); return [[d, c], v]; }) };
    const conv = [...M.viewsByCar].filter(([, v]) => v >= 5).map(([car, v]) => { const n = sum(M.book.filter((e) => e.car === car)); return [[car, `${fmt(n)} of ${fmt(v)} views`], (n / v * 100)]; }).filter(([, r]) => r > 0).sort((a, b) => b[1] - a[1]).map(([k, r]) => [k, r.toFixed(1) + '%']);
    const kinds = { testdrive: 'Test drive', call: 'Call', 'dealer-site': 'Dealer website', 'maker-site': 'Carmaker website' };
    return `<div class="kpis">
        ${kpi('Test-drive clicks', fmt(M.td), `${pct(M.td, M.carViews)} of car-page views`)}
        ${kpi('Dealer calls', fmt(M.calls), 'taps on a phone number')}
        ${kpi('Dealer websites', fmt(M.sites), 'clicks to a dealer site')}
        ${kpi('Carmaker websites', fmt(M.maker), 'clicks to the official car page')}
      </div>
      <div class="card"><h3>Booking actions per day</h3><p class="muted small">Test drives, calls and dealer websites together.</p>${chart('book', M.perDay(M.book), 'Booking actions')}</div>
      <div class="grid2">
        <div class="card"><h3>Test-drive clicks</h3>${seg('td', S.by.td, [['brand', 'Per brand'], ['car', 'Per car'], ['dealer', 'Per dealer']])}${barList(rows[S.by.td])}</div>
        <div class="card"><h3>Booking rate by car</h3><p class="muted small">Booking actions per 100 views of the car page (cars with 5+ views). High rates are the cars to pitch to dealers.</p>${barList(conv, 12)}</div>
      </div>
      <div class="grid2">
        <div class="card"><h3>Calls and dealer websites per dealer</h3>${barList(agg(M.K('call', 'dealer-site'), (e) => (e.d ? e.d + '|' + e.b : '')).map(([k, v]) => [k.split('|'), v]), 10)}</div>
        <div class="card"><h3>Carmaker website clicks per brand</h3>${barList(agg(M.K('maker-site'), (e) => e.b), 10)}</div>
      </div>
      <div class="card" style="margin-top:16px"><h3>Every booking action</h3>${M.K('testdrive', 'call', 'dealer-site', 'maker-site').length ? `<div style="overflow-x:auto"><table><thead><tr><th>Action</th><th>Car</th><th>Dealer</th><th style="text-align:right">Clicks</th></tr></thead><tbody>${M.K('testdrive', 'call', 'dealer-site', 'maker-site').sort((a, b) => b.count - a.count).slice(0, 80).map((e) => `<tr><td>${kinds[e.kind]}</td><td>${esc(e.car)}</td><td>${esc(e.kind === 'maker-site' ? '–' : e.d || '–')}</td><td class="n">${e.count}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">No booking actions yet.</p>'}</div>`;
  });
  V.videos = (M) => gcGate(M, () => {
    const rows = { brand: agg(M.vids, (e) => e.b), car: agg(M.vids, (e) => e.car) };
    const viewRate = [...M.viewsByCar].filter(([, v]) => v >= 5).map(([car, v]) => { const n = sum(M.vids.filter((e) => e.car === car)); return [[car, `${fmt(n)} of ${fmt(v)} views`], n / v * 100]; }).filter(([, r]) => r > 0).sort((a, b) => b[1] - a[1]).map(([k, r]) => [k, r.toFixed(1) + '%']);
    const search = sum(M.vids.filter((e) => e.d === 'YouTube search'));
    return `<div class="kpis">
        ${kpi('Video clicks', fmt(M.video), 'people sent to YouTube')}
        ${kpi('Cars watched', fmt(new Set(M.vids.map((e) => e.car)).size), 'with at least one video click')}
        ${kpi('Watch rate', pct(M.video, M.carViews), 'of car-page views')}
        ${kpi('Written reviews read', fmt(M.reviews), 'clicks to the expert review')}
      </div>
      <div class="card"><h3>Video clicks per day</h3>${chart('vid', M.perDay(M.vids), 'Video clicks')}</div>
      <div class="grid3">
        <div class="card"><h3>Video clicks</h3>${seg('vid', S.by.vid, [['car', 'Per car'], ['brand', 'Per brand']])}${barList(rows[S.by.vid], 12, 'gold')}</div>
        <div class="card"><h3>Per YouTube channel</h3><p class="muted small">Views each channel gets from Right Ride. Use this when pitching sponsored placements.</p>${barList(agg(M.vids, (e) => e.d || 'YouTube'), 8, 'gold')}</div>
        <div class="card"><h3>Watch rate by car</h3><p class="muted small">Video clicks per 100 car-page views (cars with 5+ views).</p>${barList(viewRate, 10, 'gold')}</div>
      </div>
      ${search ? `<p class="note">${fmt(search)} click${search === 1 ? '' : 's'} went to a YouTube search because the car has no matched review video yet. Those are views a channel could own.</p>` : ''}`;
  });
  V.audience = (M) => {
    const t = M.a && M.a.totals;
    return `${gaGate(M, () => `<div class="kpis six">
        ${kpi('Users', fmt(t.users), M.a.approx ? 'daily users added up' : '')}${kpi('New users', fmt(t.newUsers))}${kpi('Sessions', fmt(t.sessions))}
        ${kpi('Page views', fmt(t.views))}${kpi('Avg. session', dur(t.avgSec))}${kpi('Engaged', Math.round((t.engagement || 0) * 100) + '%')}</div>
      <div class="grid3">
        <div class="card"><h3>Devices</h3>${barList(M.a.devices, 4, 'gold')}</div>
        <div class="card"><h3>Cities</h3>${barList(M.a.cities, 10, 'gold')}</div>
        <div class="card"><h3>How they found us</h3>${barList(M.a.channels, 6, 'gold')}<h3 style="margin-top:16px">Sources</h3>${barList(M.a.sources, 6, 'gold')}</div>
      </div>
      <div class="grid2">
        <div class="card"><h3>Top pages</h3>${barList(M.a.pages, 10, 'gold')}</div>
        <div class="card"><h3>Events</h3>${barList(M.a.events, 12, 'gold')}</div>
      </div>`)}
      ${M.gcOn ? `<div class="grid3">
        <div class="card"><h3>Countries</h3><p class="muted small">GoatCounter${M.R.custom ? ` · last ${M.P === '365' ? 'year' : M.P + ' days'}` : ''}</p>${barList(M.g.locations, 8)}</div>
        <div class="card"><h3>Screen sizes</h3><p class="muted small">GoatCounter${M.R.custom ? ` · last ${M.P === '365' ? 'year' : M.P + ' days'}` : ''}</p>${barList(M.g.sizes, 6)}</div>
        <div class="card"><h3>Referring sites</h3><p class="muted small">GoatCounter${M.R.custom ? ` · last ${M.P === '365' ? 'year' : M.P + ' days'}` : ''}</p>${barList(M.g.refs, 8)}</div>
      </div>` : ''}`;
  };
  V.money = (M) => {
    const k = 30 / M.R.n;
    const topBrands = agg(M.book, (e) => e.b).slice(0, 6), topCh = agg(M.vids, (e) => e.d || 'YouTube').slice(0, 6);
    const mob = M.a ? (M.a.devices.find((d) => d[0] === 'mobile') || [0, 0])[1] / (M.a.devices.reduce((s, d) => s + d[1], 0) || 1) : null;
    return `<div class="grid2" style="margin-top:0">
        <div class="card"><h3>Estimated earnings</h3><div class="big">${rs(M.earn)}</div><p class="muted small">${M.R.custom ? `from ${niceDay(M.R.from)} to ${niceDay(M.R.to)}` : `in the last ${S.days === 365 ? 'year' : S.days + ' days'}`} · about <b>${rs(M.earn * k)}</b> a month at this pace</p></div>
        <div class="card"><h3>Biggest opportunity</h3>${(() => { const top = [...M.streams].sort((a, b) => b.earn - a.earn)[0]; return top && top.earn ? `<div class="big" style="font-size:1.5rem">${esc(top.name)}</div><p class="muted small">${esc(top.why)}. ${rs(top.earn)} of the ${rs(M.earn)} total.</p>` : '<p class="empty">Not enough activity yet.</p>'; })()}</div>
      </div>
      <div class="card" style="margin-top:16px"><h3>Revenue streams</h3><p class="muted small">Change the rates to what partners actually pay you; they're saved on this device. The defaults are rough Indian market guesses, not quotes.</p>
        <div style="overflow-x:auto"><table class="money"><thead><tr><th>Stream</th><th>What's counted</th><th style="text-align:right">Count</th><th style="text-align:right">Rate (₹)</th><th style="text-align:right">Earnings</th><th style="text-align:right">Per month</th></tr></thead><tbody>
        ${M.streams.map((s) => `<tr><td><b>${esc(s.name)}</b><div class="why">${esc(s.why)}</div></td><td class="muted">${esc(s.what)}</td><td class="n">${s.k === 'rpm' ? (s.n).toFixed(1) : fmt(s.n)}</td><td class="n"><input type="number" min="0" step="any" inputmode="decimal" data-rate="${s.k}" value="${RATE[s.k]}" aria-label="${esc(s.name)} rate"></td><td class="n">${rs(s.earn)}</td><td class="n">${rs(s.earn * k)}</td></tr>`).join('')}
        </tbody><tfoot><tr><td colspan="4">Total</td><td class="n">${rs(M.earn)}</td><td class="n">${rs(M.earn * k)}</td></tr></tfoot></table></div>
        <button class="btn" data-reset style="margin-top:12px">Reset rates</button></div>
      <div class="grid3">
        <div class="card"><h3>Dealers to pitch</h3><p class="muted small">Brands whose cars get the most booking actions. Offer their dealers a per-lead deal.</p>${barList(topBrands, 6)}</div>
        <div class="card"><h3>Channels to pitch</h3><p class="muted small">YouTube channels getting views from Right Ride. Offer a featured spot or a revenue share.</p>${barList(topCh, 6, 'gold')}</div>
        <div class="card"><h3>Your ad audience</h3><p class="muted small">What an advertiser buys.</p><ol class="list">
          <li><span class="nm">Page views</span><span class="ct">${fmt(M.pageViews)}</span></li>
          <li><span class="nm">Visitors</span><span class="ct">${fmt(M.gcOn ? M.visitors : M.a ? M.a.totals.users : 0)}</span></li>
          ${mob != null ? `<li><span class="nm">On mobile</span><span class="ct">${Math.round(mob * 100)}%</span></li>` : ''}
          ${M.a && M.a.cities[0] ? `<li><span class="nm">Top city</span><span class="ct">${esc(M.a.cities[0][0])}</span></li>` : ''}
          <li><span class="nm">People ready to buy</span><span class="ct">${fmt(M.td + M.calls)}</span></li></ol></div>
      </div>
      <div class="card" style="margin-top:16px"><h3>More ways to earn</h3><p class="muted small">Not tracked yet. Each needs a button or partner first, then it shows up here.</p><ul class="ideas">
        <li><b>Car loans and insurance:</b> a "Check loan offers" / "Get an insurance quote" button on each car page, paid per approved lead by banks and insurers.</li>
        <li><b>Featured listings:</b> carmakers or dealers pay to be highlighted on the cars page and in comparisons (clearly labelled as sponsored).</li>
        <li><b>Old-car exchange:</b> "What's my current car worth?" referrals to used-car buyers, paid per inspection booked.</li>
        <li><b>Accessories:</b> affiliate links for dashcams, seat covers and tyres on each car page.</li>
        <li><b>Market reports:</b> anonymous monthly reports on which cars Indian buyers compare and book, sold to brands.</li></ul></div>`;
  };

  function draw() {
    $('#out').hidden = false; $('#nav').hidden = false;
    const M = model();
    $('#nav').innerHTML = TABS.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}</button>`).join('');
    $('#app').innerHTML = `
      <div class="bar"><div class="seg" role="group" aria-label="Period">${[7, 30, 90, 365].map((d) => `<button data-days="${d}" aria-pressed="${S.days === d}">${d === 365 ? '1 year' : d + ' days'}</button>`).join('')}<button data-days="custom" aria-pressed="${M.R.custom}">Custom</button></div>
        ${M.R.custom ? `<span class="dates"><label class="sr" for="dFrom">From</label><input type="date" id="dFrom" value="${M.R.from}" min="${M.R.first}" max="${M.R.last}"><span class="muted">to</span><label class="sr" for="dTo">To</label><input type="date" id="dTo" value="${M.R.to}" min="${M.R.first}" max="${M.R.last}"><span class="muted small">${M.R.n} day${M.R.n === 1 ? '' : 's'}</span></span>` : ''}
        <span class="muted small">Updated ${esc(ago(DATA.built))} · refreshes every hour</span><span style="flex:1"></span>
        <span class="links"><a class="btn" href="https://analytics.google.com/analytics/web/" target="_blank" rel="noopener">Google Analytics ↗</a><a class="btn" href="https://${esc(DATA.gc.code)}.goatcounter.com" target="_blank" rel="noopener">GoatCounter ↗</a></span></div>
      ${V[S.tab](M)}`;
    wire();
  }
  const go = (t) => { S.tab = t; LS.set('tab', t); history.replaceState(null, '', '#' + t); draw(); scrollTo(0, 0); };
  function wire() {
    for (const b of document.querySelectorAll('[data-tab]')) b.onclick = () => go(b.dataset.tab);
    for (const b of document.querySelectorAll('[data-go]')) b.onclick = (e) => { e.preventDefault(); go(b.dataset.go); };
    for (const b of document.querySelectorAll('[data-days]')) b.onclick = () => { S.days = b.dataset.days === 'custom' ? 'custom' : +b.dataset.days; LS.set('days', S.days); draw(); if (S.days === 'custom') { const f = $('#dFrom'); if (f) f.focus(); } };
    for (const id of ['dFrom', 'dTo']) { const i = document.getElementById(id); if (i) i.onchange = () => { if (!i.value) return; S[id === 'dFrom' ? 'from' : 'to'] = i.value; LS.set(id === 'dFrom' ? 'from' : 'to', i.value); draw(); }; }
    for (const b of document.querySelectorAll('[data-by]')) b.onclick = () => { S.by[b.dataset.by] = b.dataset.v; draw(); };
    for (const i of document.querySelectorAll('[data-rate]')) i.onchange = () => { const v = parseFloat(i.value); RATE[i.dataset.rate] = isFinite(v) && v >= 0 ? v : RATE_DEF[i.dataset.rate]; LS.set('rates', JSON.stringify(RATE)); draw(); };
    const r = document.querySelector('[data-reset]'); if (r) r.onclick = () => { RATE = { ...RATE_DEF }; LS.set('rates', ''); draw(); };
    for (const ch of document.querySelectorAll('.chart[data-ch]')) {
      const c = CH[ch.dataset.ch], tip = ch.querySelector('.tip');
      ch.onmousemove = (e) => { const gg = e.target.closest('g[data-i]'); if (!gg) { tip.style.opacity = 0; return; } const x = c.days[+gg.dataset.i]; const rc = ch.getBoundingClientRect(); tip.textContent = `${new Date(x.d).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' })}: ${fmt(x.v)} ${c.label.toLowerCase()}${c.lineLabel ? ` · ${fmt(x.g)} ${c.lineLabel}` : ''}`; tip.style.left = (e.clientX - rc.left) + 'px'; tip.style.top = (e.clientY - rc.top) + 'px'; tip.style.opacity = 1; };
      ch.onmouseleave = () => { tip.style.opacity = 0; };
    }
  }
  addEventListener('hashchange', () => { const t = location.hash.slice(1); if (DATA && TABS.some(([k]) => k === t) && t !== S.tab) go(t); });
  $('#out').onclick = () => { LS.set('key', ''); SS.set('key', ''); DATA = null; login(); };
  start();
})();
</script>
</body>
</html>
